        :root {
            --primary: #CCFF00;
            /* Lime Green */
            --bg-page: #2F2F2D;
            /* Updated page background */
            --bg-card: #161618;
            /* Updated card background */
            --input-bg: #1E1E1E;
            --text-main: #ffffff;
            --text-muted: #A1A1A1;
            --border-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            background: var(--bg-page);
            display: flex;
            align-items: flex-start;
            /* Changed from center to move higher */
            justify-content: center;
            overflow: hidden;
            padding-top: 1vh;
            /* Added top spacing */
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            /* Restored container width constraint */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 4vh;
        }

        .login-card {
            width: 100%;
            max-width: 330px;
            /* Reduced specific size again */
            background: var(--bg-card);
            border-radius: 16px;
            /* Slightly smaller radius */
            padding: 1.25rem 1.5rem;
            /* Further reduced padding */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            position: relative;
            z-index: 10;
        }

        .card-header {
            text-align: center;
            /* Centered like original */
            margin-bottom: 1rem;
            /* Reduced margin */
        }

        .card-title {
            font-size: 1.5rem;
            /* Smaller title */
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 0.8rem;
            /* Further reduced margin */
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 0.6rem 0.9rem;
            /* Further reduced padding */
            padding-right: 2.2rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            /* Smaller radius */
            color: white;
            font-size: 0.9rem;
            /* Smaller font */
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-input::placeholder {
            color: #555;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--primary);
            width: 14px;
            height: 14px;
        }

        .forgot-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: white;
        }

        .submit-button {
            width: 100%;
            padding: 0.7rem;
            /* Further reduced padding */
            background: var(--primary);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s, background-color 0.2s;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            background-color: #b3e600;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 0.8rem 0;
            /* Further reduced margin */
            color: #555;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }

        .divider::before {
            margin-right: 1rem;
        }

        .divider::after {
            margin-left: 1rem;
        }

        .sso-button {
            width: 100%;
            padding: 0.65rem;
            /* Further reduced padding */
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .sso-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .google-error-banner {
            display: none;
            background: rgba(255, 68, 68, 0.12);
            border: 1px solid rgba(255, 68, 68, 0.4);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #ff6b6b;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .google-error-banner a {
            color: var(--primary);
            text-decoration: underline;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-prompt {
            text-align: center;
            margin-top: 1rem;
            /* Reduced margin */
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .signup-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        /* RESTORED CHARACTER ANIMATIONS */
        .char {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            animation-duration: 0.8s;
            animation-fill-mode: forwards;
            animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .char.left-1 {
            left: calc(50% + 70px);
            top: 28%;
            width: 320px;
            z-index: 20;
            animation-name: entryRight;
        }

        .char.left-2 {
            left: 80px;
            padding-top: 10%;
            width: 350px;
            z-index: 5;
            animation-name: entryLeft;
            animation-delay: 0.1s;
        }

        .char.right-1 {
            left: 390px;
            padding-top: 40%;
            width: 460px;
            z-index: 15;
            animation-name: entryBottom;
            animation-delay: 0.2s;
        }

        .char.right-2 {
            left: 780px;
            padding-top: 10%;
            width: 340px;
            z-index: 5;
            animation-name: entryRight;
            animation-delay: 0.3s;
        }

        .char.sleeping {
            right: -200px;
            top: 20%;
            width: 360px;
            animation-name: entryRight;
            animation-delay: 0.4s;
        }

        @keyframes entryLeft {
            from {
                transform: translateX(-100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes entryRight {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes entryBottom {
            from {
                transform: translateY(100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .character-base {
            position: fixed;
            top: 87vh;
            left: 0;
            width: 100vw;
            height: 30vh;
            background: #20201f;
            z-index: 2;
            pointer-events: none;
            animation: baseFade 1s ease 0.5s forwards;
            opacity: 0;
        }

        @keyframes baseFade {
            to {
                opacity: 1;
            }
        }
        @media (max-width: 850px) {
            .char,
            .character-base,
            .marquee-tape {
                display: none;
            }
        }

        .auth-logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            width: 150px;
            z-index: 50;
            transition: transform 0.3s;
        }

        .auth-logo:hover {
            transform: scale(1.05);
        }

        .auth-logo img {
            width: 100%;
            height: auto;
            display: block;
        }

            .divider {

            }

            .signup-prompt {
                margin-top: 0.75rem !important;
                font-size: 0.78rem !important;
            }
        }
    </style>

                        const authData = { loggedIn: true, user: data.user || null, ts: Date.now() };
                        localStorage.setItem('mkavs_auth_cache', JSON.stringify(authData));
                    } catch(e) {}
                    // Success -> Redirect to Home
                    window.location.href = '/index.html';
                } else {
                    // Error
                    errorEl.style.display = 'block';
                    errorEl.textContent = data.error || 'Login failed';
                    btn.innerHTML = originalText;
                    btn.style.opacity = '1';
                    grecaptcha.reset();
                    recaptchaCompleted = false;
                }
            } catch (err) {
                console.error('Login Error:', err);
                errorEl.style.display = 'block';
                errorEl.textContent = 'An error occurred. Please try again.';
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                grecaptcha.reset();
                recaptchaCompleted = false;
            }
        });
    </script>

    <!-- Mobile Side Menu Logic -->
    <script>
    (() => {
        const mobileMenuTrigger = document.getElementById('mobile-menu-trigger');
        const customTrigger = document.getElementById('custom-mobile-menu-trigger');
        const trigger = mobileMenuTrigger || customTrigger;
        const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
        const mobileMenuPanel = document.getElementById('mobile-menu-panel');
        const mobileMenuClose = document.getElementById('mobile-menu-close');

        if (trigger && mobileMenuOverlay && mobileMenuPanel) {
            const openMobileMenu = () => {
                mobileMenuPanel.classList.remove('-translate-x-full');
                mobileMenuOverlay.classList.remove('opacity-0', 'pointer-events-none');
                mobileMenuOverlay.classList.add('opacity-100', 'pointer-events-auto');
            };

            const closeMobileMenu = () => {
                mobileMenuPanel.classList.add('-translate-x-full');
                mobileMenuOverlay.classList.remove('opacity-100', 'pointer-events-auto');
                mobileMenuOverlay.classList.add('opacity-0', 'pointer-events-none');
            };

            trigger.addEventListener('click', openMobileMenu);
            if (mobileMenuClose) mobileMenuClose.addEventListener('click', closeMobileMenu);
            mobileMenuOverlay.addEventListener('click', closeMobileMenu);
        }
    })();
    </script>
