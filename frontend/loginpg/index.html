<head>

    <style>
                :root {
            --primary: #000000;
            --bg-page: #FAFAFA;
            --bg-card: transparent;
            --input-bg: #F3F4F6;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

                body,
        html {
            height: 100%;
            width: 100%;
            background: var(--bg-page);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Outfit', sans-serif;
        }

                .auth-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

                .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border-radius: 0;
            padding: 2rem;
            box-shadow: none;
            border: none;
            position: relative;
            z-index: 10;
        }

        .card-header {
            text-align: center;
            /* Centered like original */
            margin-bottom: 1rem;
            /* Reduced margin */
        }

        
        .card-title {
            font-size: 2.5rem;
            font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
            font-weight: 800;
            color: #0d3b66;
            margin-bottom: 0.25rem;
        }
    

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 0.8rem;
            /* Further reduced margin */
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 0.6rem 0.9rem;
            /* Further reduced padding */
            padding-right: 2.2rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            /* Smaller radius */
            color: var(--text-main);
            font-size: 0.9rem;
            /* Smaller font */
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-input::placeholder {
            color: #555;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--primary);
            width: 14px;
            height: 14px;
        }

        .forgot-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: white;
        }

                .submit-button {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            background-color: #b3e600;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 0.8rem 0;
            /* Further reduced margin */
            color: #555;
            font-size: 0.7rem;
            
            letter-spacing: 1px;
        }

                .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E5E7EB;
        }

        .divider::before {
            margin-right: 1rem;
        }

        .divider::after {
            margin-left: 1rem;
        }

                .sso-button {
            width: 100%;
            padding: 0.75rem;
            background: #FFFFFF;
            color: #374151;
            border: 1px solid #E5E7EB;
            border-radius: 9999px; /* Pill shape */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            text-decoration: none;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .sso-button:hover {
            background: #F9FAFB;
            border-color: #D1D5DB;
        }

        .sso-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .google-error-banner {
            display: none;
            background: rgba(255, 68, 68, 0.12);
            border: 1px solid rgba(255, 68, 68, 0.4);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #ff6b6b;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .google-error-banner a {
            color: var(--primary);
            text-decoration: underline;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-prompt {
            text-align: center;
            margin-top: 1rem;
            /* Reduced margin */
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .signup-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        /* RESTORED CHARACTER ANIMATIONS */
        .char {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            animation-duration: 0.8s;
            animation-fill-mode: forwards;
            animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .char.left-1 {
            left: calc(50% + 70px);
            top: 28%;
            width: 320px;
            z-index: 20;
            animation-name: entryRight;
        }

        .char.left-2 {
            left: 80px;
            padding-top: 10%;
            width: 350px;
            z-index: 5;
            animation-name: entryLeft;
            animation-delay: 0.1s;
        }

        .char.right-1 {
            left: 390px;
            padding-top: 40%;
            width: 460px;
            z-index: 15;
            animation-name: entryBottom;
            animation-delay: 0.2s;
        }

        .char.right-2 {
            left: 780px;
            padding-top: 10%;
            width: 340px;
            z-index: 5;
            animation-name: entryRight;
            animation-delay: 0.3s;
        }

        .char.sleeping {
            right: -200px;
            top: 20%;
            width: 360px;
            animation-name: entryRight;
            animation-delay: 0.4s;
        }

        @keyframes entryLeft {
            from {
                transform: translateX(-100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes entryRight {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes entryBottom {
            from {
                transform: translateY(100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        

        
        }

        @media (max-width: 850px) {

            .char,
            .character-base,
            .marquee-tape {
                display: none;
            }
        }

        .auth-logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            width: 150px;
            z-index: 50;
            transition: transform 0.3s;
        }

        .auth-logo:hover {
            transform: scale(1.05);
        }

        .auth-logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 600px) {
            .auth-logo {
                width: 120px;
                top: 1.5rem;
                left: 1.5rem;
            }
        }
    
        @media (max-width: 1023px) {
            .auth-logo img {
                filter: brightness(0);
            }
        }
    
</style>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.querySelector('.password-toggle');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Wire up Google Sign-In button
        document.getElementById('googleSignInBtn').addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = MKAVS_CONFIG.API_BASE_URL + '/auth/google?flow=login&source=desktop';
        });

        // Check for error parameters in URL (Google Auth redirects)
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorEl = document.getElementById('error-message');
        const googleBanner = document.getElementById('google-error-banner');

        if (error) {
            if (error === 'no_account') {
                googleBanner.style.display = 'block';
                googleBanner.innerHTML = '⚠️ No account found for that Google profile. Please <a href="/signpg/index.html">create an account</a> first.';
            } else if (error === 'auth_failed') {
                googleBanner.style.display = 'block';
                googleBanner.textContent = 'Google authentication failed. Please try again.';
            } else {
                errorEl.style.display = 'block';
                errorEl.textContent = 'An error occurred. Please try again.';
            }
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // reCAPTCHA callback functions
        let recaptchaCompleted = false;

        function onRecaptchaSuccess(token) {
            recaptchaCompleted = true;
            document.getElementById('recaptcha-error').style.display = 'none';
        }

        function onRecaptchaExpired() {
            recaptchaCompleted = false;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('.submit-button');
            const originalText = btn.innerText;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-message');
            const recaptchaError = document.getElementById('recaptcha-error');

            // Get reCAPTCHA token
            const recaptchaToken = grecaptcha.getResponse();

            // Reset errors
            errorEl.style.display = 'none';
            errorEl.textContent = '';
            recaptchaError.style.display = 'none';

            // Validate reCAPTCHA
            if (!recaptchaToken) {
                recaptchaError.style.display = 'block';
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.style.opacity = '0.7';

            try {
                const response = await fetch(MKAVS_CONFIG.API_BASE_URL + '/api/signin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password, recaptchaToken })
                });

                const data = await response.json();

                if (response.ok) {
                    // Cache auth state so navbar shows Logout instantly across all pages
                    try {
                        const authData = { loggedIn: true, user: data.user || null, ts: Date.now() };
                        localStorage.setItem('mkavs_auth_cache', JSON.stringify(authData));
                    } catch(e) {}
                    // Success -> Redirect to Home
                    window.location.href = '/Home';
                } else {
                    // Error
                    errorEl.style.display = 'block';
                    errorEl.textContent = data.error || 'Login failed';
                    btn.innerHTML = originalText;
                    btn.style.opacity = '1';
                    // Reset reCAPTCHA on error
                    grecaptcha.reset();
                    recaptchaCompleted = false;
                }
            } catch (err) {
                console.error('Login Error:', err);
                errorEl.style.display = 'block';
                errorEl.textContent = 'An error occurred. Please try again.';
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                // Reset reCAPTCHA on error
                grecaptcha.reset();
                recaptchaCompleted = false;
            }
        });
    </script>

    <!-- Mobile Side Menu Logic -->
    <script>
    (() => {
        const mobileMenuTrigger = document.getElementById('mobile-menu-trigger');
        const customTrigger = document.getElementById('custom-mobile-menu-trigger');
        const trigger = mobileMenuTrigger || customTrigger;
        const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
        const mobileMenuPanel = document.getElementById('mobile-menu-panel');
        const mobileMenuClose = document.getElementById('mobile-menu-close');

        if (trigger && mobileMenuOverlay && mobileMenuPanel) {
            const openMobileMenu = () => {
                mobileMenuPanel.classList.remove('-translate-x-full');
                mobileMenuOverlay.classList.remove('opacity-0', 'pointer-events-none');
                mobileMenuOverlay.classList.add('opacity-100', 'pointer-events-auto');
            };

            const closeMobileMenu = () => {
                mobileMenuPanel.classList.add('-translate-x-full');
                mobileMenuOverlay.classList.remove('opacity-100', 'pointer-events-auto');
                mobileMenuOverlay.classList.add('opacity-0', 'pointer-events-none');
            };

            trigger.addEventListener('click', openMobileMenu);
            if (mobileMenuClose) mobileMenuClose.addEventListener('click', closeMobileMenu);
            mobileMenuOverlay.addEventListener('click', closeMobileMenu);
        }
    });
    </script>
