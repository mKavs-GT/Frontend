<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mkavs-sidebar-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#020617" />

  <body>
    <div id="root"></div>
    <script>
      // Safety Net for 'Terminal' ReferenceError
      if (typeof window.Terminal === 'undefined') {
        window.Terminal = class {
          constructor() { console.warn('Terminal Safety Net: Global "Terminal" class was accessed but not defined. Creating dummy instance.'); }
          open() {}
          write() {}
          writeln() {}
          onData() {}
          onKey() {}
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
