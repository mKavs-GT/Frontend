    <!-- Fix Discord Icon and MRV Mascot Image -->
    <script>
    (() => {
        const fixAssets = () => {
            // Fix Discord Icon
            const discordLink = document.querySelector('a[href*="discord.gg"]');
            if (discordLink) {
                const wrongSvg = discordLink.querySelector('svg');
                if (wrongSvg && !wrongSvg.classList.contains('discord-icon')) {
                    wrongSvg.innerHTML = `<path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.032.057a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>`;
                    wrongSvg.setAttribute('viewBox', '0 0 24 24');
                    wrongSvg.setAttribute('fill', 'currentColor');
                    wrongSvg.setAttribute('stroke', 'none');
                    wrongSvg.classList.remove('lucide', 'lucide-disc');
                    wrongSvg.classList.add('discord-icon');
                }
            }

            // Fix MRV Mascot Image
            const mascotImg = document.querySelector('img[alt="MRV Mascot"]');
            if (mascotImg && !mascotImg.src.includes('/images/mrv.png')) {
                mascotImg.src = '/images/mrv.png';
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(fixAssets, 500);
                setTimeout(fixAssets, 1500);
                setTimeout(fixAssets, 3000);
            });
        } else {
            setTimeout(fixAssets, 500);
            setTimeout(fixAssets, 1500);
            setTimeout(fixAssets, 3000);
        }
    })();
    </script>

    <!-- Mobile Side Menu Logic -->
    <script>
    (() => {
        const mobileMenuTrigger = document.getElementById('mobile-menu-trigger');
        const customTrigger = document.getElementById('custom-mobile-menu-trigger');
        const trigger = mobileMenuTrigger || customTrigger;
        const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
        const mobileMenuPanel = document.getElementById('mobile-menu-panel');
        const mobileMenuClose = document.getElementById('mobile-menu-close');

        if (trigger && mobileMenuOverlay && mobileMenuPanel) {
            const openMobileMenu = () => {
                mobileMenuPanel.classList.remove('-translate-x-full');
                mobileMenuOverlay.classList.remove('opacity-0', 'pointer-events-none');
                mobileMenuOverlay.classList.add('opacity-100', 'pointer-events-auto');
            };

            const closeMobileMenu = () => {
                mobileMenuPanel.classList.add('-translate-x-full');
                mobileMenuOverlay.classList.remove('opacity-100', 'pointer-events-auto');
                mobileMenuOverlay.classList.add('opacity-0', 'pointer-events-none');
            };

            trigger.addEventListener('click', openMobileMenu);
            if (mobileMenuClose) mobileMenuClose.addEventListener('click', closeMobileMenu);
            mobileMenuOverlay.addEventListener('click', closeMobileMenu);
        }
    });
    </script>
