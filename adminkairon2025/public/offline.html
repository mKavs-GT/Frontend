<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - MKAVS Admin</title>
    <style>
        body {
            background-color: #020617;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            items-center: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; color: #c7f908; }
        p { color: #94a3b8; max-width: 400px; line-height: 1.5; }
        .icon { font-size: 4rem; margin-bottom: 2rem; }
        button {
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: #c7f908;
            color: black;
            border: none;
            border-radius: 9999px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="icon">📡❌</div>
    <h1>You're Offline</h1>
    <p>It seems you don't have an active internet connection. The MKAVS Admin panel is partially available offline using cached data.</p>
    <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
